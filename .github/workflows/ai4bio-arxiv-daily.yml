# This is a basic workflow to help you get started with Actions

name: Run Arxiv Papers Daily

permissions:
  contents: write
  issues: write

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "37 22 * * *"
  # Triggers the workflow on push or pull request events but only for the main branch
#   push:
#     branches:
#     - main

env:
  GITHUB_USER_NAME: "ziyiwng"
  GITHUB_USER_EMAIL: "1556199250@qq.com"
  
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up Python Env
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          #architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv
          pip install requests
          pip install pyyaml
          
      - name: Run daily arxiv 
        run: |
          python daily_arxiv.py --notification-output "${{ runner.temp }}/daily-notification.md"
          
      - name: Push new ai4bio-arxiv-daily.md
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "GitHub Action: Update AI4Bio arXiv papers 📚"
          files: README.md docs/ai4bio-arxiv-daily.json docs/ai4bio-arxiv-daily-web.json docs/index.md docs/ai4bio-arxiv-daily-wechat.json docs/wechat.md
          rebase: 'true'
          name: ${{ env.GITHUB_USER_NAME }}
          email: ${{ env.GITHUB_USER_EMAIL }}

      - name: Publish daily paper notification
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ vars.DAILY_PAPER_ISSUE_NUMBER }}
          NOTIFICATION_FILE: ${{ runner.temp }}/daily-notification.md
        run: |
          if [ -s "$NOTIFICATION_FILE" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "Repository variable DAILY_PAPER_ISSUE_NUMBER is not configured."
              exit 1
            fi
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$NOTIFICATION_FILE"
          else
            echo "No new papers; skipping issue notification."
          fi
